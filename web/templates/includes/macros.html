{% from "includes/icons.html" import icon %}
{#- 파일 올리기 칸: 누르거나 끌어 놓기. 고른 파일 이름이 칸에 보인다. -#}
{% macro file_zone(field_id, field_name, accept, placeholder, ext_label, big=false, required=true) %}
<div class="upload{% if big %} upload-big{% endif %} file-drop-zone" data-dropzone-for="{{ field_id }}" role="button" tabindex="0" aria-label="{{ placeholder }}">
  <span class="ico">{{ icon('upload', 'icon-lg') }}</span>
  <span class="zone-label filename">{{ placeholder }}</span>
  <span class="zone-ext">{{ ext_label }}</span>
  <input id="{{ field_id }}" name="{{ field_name }}" type="file" accept="{{ accept }}" class="hidden" {% if required %}required{% endif %}/>
</div>
{% endmacro %}
