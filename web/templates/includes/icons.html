{#- 꼭 필요한 곳에만 쓰는 선 아이콘 (외부 글꼴 없이) -#}
{% macro icon(name, cls='') -%}
<svg class="icon {{ cls }}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
{%- if name == 'upload' %}<path d="M12 16V4"/><path d="m7 9 5-5 5 5"/><path d="M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/>
{%- elif name == 'file' %}<path d="M14 3H7a1 1 0 0 0-1 1v16a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1V7z"/><path d="M14 3v4h4"/>
{%- elif name == 'sheet' %}<rect x="4" y="3" width="16" height="18" rx="1"/><path d="M4 9h16M4 15h16M10 3v18"/>
{%- elif name == 'check' %}<path d="m5 12 5 5 9-10"/>
{%- elif name == 'alert' %}<path d="M12 3 2 20h20z"/><path d="M12 10v4"/><path d="M12 17h.01"/>
{%- elif name == 'info' %}<circle cx="12" cy="12" r="9"/><path d="M12 11v5"/><path d="M12 8h.01"/>
{%- elif name == 'download' %}<path d="M12 4v12"/><path d="m7 11 5 5 5-5"/><path d="M4 20h16"/>
{%- elif name == 'back' %}<path d="M19 12H5"/><path d="m11 6-6 6 6 6"/>
{%- elif name == 'chev' %}<path d="m6 9 6 6 6-6"/>
{%- elif name == 'edit' %}<path d="M4 20h4L19 9l-4-4L4 16z"/>
{%- elif name == 'spin' %}<path d="M21 12a9 9 0 1 1-9-9"/>
{%- endif %}</svg>
{%- endmacro %}
